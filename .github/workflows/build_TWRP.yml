name: Build - TWRP

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-12.1
          - twrp-11
          - twrp-9.0
          - twrp-8.1
      DEVICE_TREE:
        description: 'Custom Recovery Tree (device tree repo URL)'
        required: true
        default: 'https://github.com/Charles078728/twrp_device_tecno_bf7'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'android-12'
      DEVICE_PATH:
        description: 'Device Path (like DEVICE_PATH in BoardConfig.mk)'
        required: true
        default: 'device/tecno/bf7'
      DEVICE_NAME:
        description: 'Device Codename (like PRODUCT_DEVICE)'
        required: true
        default: 'bf7'
      BUILD_TARGET:
        description: 'What image to build'
        required: true
        default: 'boot'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      LDCHECK:
        description: 'Path of blob to check deps (for decryption)'
        required: true
        default: 'system/bin/qseecomd'

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      # Normalize DEVICE_NAME to lowercase and guarantee fallback
      - name: Normalize device codename
        run: |
          if [ -z "${{ github.event.inputs.DEVICE_NAME }}" ]; then
            echo "DEVICE_NAME_LC=bf7" >> $GITHUB_ENV
          else
            echo "DEVICE_NAME_LC=$(echo '${{ github.event.inputs.DEVICE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          fi

      - name: Display Inputs
        run: |
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Device Tree:    ${{ github.event.inputs.DEVICE_TREE }}"
          echo "Device Branch:  ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path:    ${{ github.event.inputs.DEVICE_PATH }}"
          echo "Device Name:    ${{ env.DEVICE_NAME_LC }}"
          echo "Build Target:   ${{ github.event.inputs.BUILD_TARGET }}image"
          echo "LDCheck Blob:   ${{ github.event.inputs.LDCHECK }}"

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Prepare the environment
        run: |
          sudo apt update && sudo apt upgrade -y
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install Git-Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Select manifest URL
        id: manifest
        uses: haya14busa/action-cond@v1
        with:
          cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' }}
          if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
          if_false: https://github.com/sounddrill31/platform_manifest_twrp_omni.git

      - name: Initialize Repo
        run: |
          mkdir android-recovery
          cd android-recovery
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
          sed -i '/<remove-project name="platform\/external\/gflags"  \/>/d' .repo/manifests/remove-minimal.xml

      - name: Repo Sync
        run: |
          cd android-recovery
          repo sync -j$(nproc --all) --force-sync

      - name: Clone Device Tree
        run: |
          cd android-recovery
          git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
          cd ${{ github.event.inputs.DEVICE_PATH }}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Check Build Makefile
      run: |
        cd android-recovery
        if [ -f ${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f ${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "No recovery makefile file found!"
        fi
      continue-on-error: true

      - name: Install Python 2 (for older manifests)
        if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1'
        run: |
          sudo apt -y install python
          sudo rm -rf /usr/bin/python
          sudo ln -s /usr/bin/python2 /usr/bin/python

      - name: Build Image
        run: |
          cd android-recovery
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          # Log build output
          lunch ${{ env.DEVICE_MAKEFILE }}-eng
          make clean
          make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all) 2>&1 | tee $GITHUB_WORKSPACE/build.log
          echo "Done building ${{ github.event.inputs.BUILD_TARGET }}.img"

      - name: Set Build Date
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      # Upload built image (boot / recovery / vendor_boot) if it exists
      - name: Upload built image
        uses: softprops/action-gh-release@v2
        if: github.event.inputs.BUILD_TARGET == 'boot' || github.event.inputs.BUILD_TARGET == 'recovery'
        with:
          files: |
            android-recovery/out/target/product/${{ env.DEVICE_NAME_LC }}/${{ github.event.inputs.BUILD_TARGET }}.img
          name: Unofficial TWRP for ${{ env.DEVICE_NAME_LC }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            **Unofficial TWRP Build**
            - **Device:** `${{ env.DEVICE_NAME_LC }}`
            - **Manifest Branch:** `${{ github.event.inputs.MANIFEST_BRANCH }}`
            - **Build Target:** `${{ github.event.inputs.BUILD_TARGET }}`
            - **Device Tree:** ${{ github.event.inputs.DEVICE_TREE }} (branch: `${{ github.event.inputs.DEVICE_TREE_BRANCH }}`)
            - **Commit:** ${{ env.COMMIT_ID }}

      - name: Upload built vendor_boot
        uses: softprops/action-gh-release@v2
        if: github.event.inputs.BUILD_TARGET == 'vendorboot'
        with:
          files: |
            android-recovery/out/target/product/${{ env.DEVICE_NAME_LC }}/vendor_boot.img
          name: Unofficial TWRP for ${{ env.DEVICE_NAME_LC }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            **Unofficial TWRP Build**
            - **Device:** `${{ env.DEVICE_NAME_LC }}`
            - **Manifest Branch:** `${{ github.event.inputs.MANIFEST_BRANCH }}`
            - **Build Target:** `vendor_boot`
            - **Device Tree:** ${{ github.event.inputs.DEVICE_TREE }} (branch: `${{ github.event.inputs.DEVICE_TREE_BRANCH }}`)
            - **Commit:** ${{ env.COMMIT_ID }}

      # LDCheck – run only if recovery root exists
      - name: Run LDCheck
        run: |
          ROOT_DIR="${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ env.DEVICE_NAME_LC }}/recovery/root"
          if [ ! -d "$ROOT_DIR" ]; then
            echo "Recovery root not found at $ROOT_DIR, skipping LDCheck."
            exit 0
          fi

          cd tools
          mv -n libneeds "$ROOT_DIR" || true
          mv -n ldcheck "$ROOT_DIR" || true
          cd "$ROOT_DIR"
          python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECK }} || true
          echo "LDCheck completed. Review output above if any."

      # Upload build logs as artifacts (for debugging)
      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.DEVICE_NAME_LC }}-${{ env.BUILD_DATE }}
          path: |
            ${{ github.workspace }}/build.log
            android-recovery/out/target/product/${{ env.DEVICE_NAME_LC }}/recovery/root/recovery.log
          if-no-files-found: ignore

      # Telegram notification (expects your script to handle formatting)
      - name: Send release info to Telegram
        run: |
          chmod +x .github/scripts/send_to_telegram.sh
          .github/scripts/send_to_telegram.sh \
            "${{ env.DEVICE_NAME_LC }}" \
            "${{ github.event.inputs.MANIFEST_BRANCH }}" \
            "${{ env.BUILD_DATE }}" \
            "${{ env.COMMIT_ID }}" \
            "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.run_id }}" \
            "${{ github.event.inputs.DEVICE_TREE }}" \
            "${{ secrets.TELEGRAM_CHAT_ID }}" \
            "${{ secrets.TELEGRAM_TOKEN }}" \
            "${{ github.workflow }}"
